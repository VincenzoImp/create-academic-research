name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npx -y github-actionlint

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run release:check -- "$(node -p "'v' + require('./package.json').version")"
      - run: npm test
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npm pack --dry-run
      - name: E2E generated project
        if: matrix.node-version == '22'
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          TMPDIR="$(mktemp -d)"
          CREATE_ACADEMIC_RESEARCH_PACKAGE_SPEC="file:$PWD/$TARBALL" \
            npm exec --yes --package "$PWD/$TARBALL" -- \
            create-academic-research "$TMPDIR/e2e-research" --yes --no-install-skills
          cd "$TMPDIR/e2e-research"
          npm install --ignore-scripts
          npm run doctor
          npm run workflow:literature
          npm run doctor
          npm run mcp:dotenv
          npm run mcp:doctor -- --env-file .env.example
          npm run mcp:smoke -- --env-file .env.example
          python -m pip install -e ".[dev]"
          python -m pytest -q
