name: Validate

on:
  pull_request:
  push:
    branches: [main, redesign-0.2]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # uv runs the scholarly MCP servers and `make check` (uv run --python >=3.11)
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
      - name: E2E generated project
        if: matrix.node-version == '22'
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          TMP="$(mktemp -d)"
          npm exec --yes --package "$PWD/$TARBALL" -- \
            create-academic-research "$TMP/e2e" --yes --no-install-skills --no-git
          cd "$TMP/e2e"
          python3 scripts/check.py
          make check
