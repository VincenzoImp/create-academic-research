name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z, got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: npm ci
      - run: npm run release:check -- ${{ steps.release.outputs.tag }}
      - run: npm test
      - run: npm run lint
      - run: npm audit --omit=dev

      - name: Pack and smoke-test generated project
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

          tmpdir="$(mktemp -d)"
          CREATE_ACADEMIC_RESEARCH_PACKAGE_SPEC="file:$PWD/$tarball" \
            npm exec --yes --package "$PWD/$tarball" -- \
            create-academic-research "$tmpdir/e2e-research" --yes --no-install-skills

          cd "$tmpdir/e2e-research"
          npm install --ignore-scripts
          npx academic-research doctor
          npx academic-research mcp env --write .env.example --all
          npx academic-research mcp doctor --env-file .env.example
          npx academic-research mcp smoke --env-file .env.example
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          if npm view "create-academic-research@$version" version >/dev/null 2>&1; then
            echo "create-academic-research@$version is already published; skipping npm publish."
            exit 0
          fi
          npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          tarball="${{ steps.pack.outputs.tarball }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; skipping creation."
          else
            gh release create "$tag" "$tarball#npm package tarball" \
              --verify-tag \
              --generate-notes \
              --latest
          fi
