[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-research-project"
version = "0.1.0"
description = "Academic research project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4"
]
analysis = [
  "numpy>=1.26",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "seaborn>=0.13"
]
notebooks = [
  "ipykernel>=6.0",
  "jupyterlab>=4.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
